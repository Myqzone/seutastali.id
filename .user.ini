; =================================================================
; .user.ini - Per-directory PHP Configuration
; Optimized for Hostinger & Klinik Samiaji Web
; =================================================================

; Session Security & Cache (Backup jika PHP script gagal set)
session.cache_limiter = nocache
session.cache_expire = 0
session.use_cookies = 1
session.use_only_cookies = 1
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

; Error Reporting (Log path diatur dinamis di config/app.php)
display_errors = 0
error_reporting = E_ALL

; Resource Limits (Penting untuk upload file besar)
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
